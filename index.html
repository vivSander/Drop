<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#9088FF">
<title>Drop</title>
<style>
:root{--bg:#0E1120;--panel:#171B2F;--ink:#FFFFFF;--quiet:#8D94AE;--line:#2A3050;--acc:#9088FF;--acc-ink:#0E1120;--acc-soft:#25295A;--sig:#D8F34B;--sig-ink:#182000;--danger:#D6314A;--del:#C4203D;
--font:"Avenir Next","Segoe UI Variable Display","Segoe UI",system-ui,-apple-system,Roboto,"Helvetica Neue",sans-serif}
*{box-sizing:border-box}
html{color-scheme:dark}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 var(--font);-webkit-tap-highlight-color:transparent}
button,input,textarea{font:inherit;color:inherit}
.ic{display:inline-flex;flex:none}.ic svg{display:block}
.app{display:grid;grid-template-columns:248px minmax(0,1fr);grid-template-rows:auto 1fr;min-height:100dvh}
.top{grid-column:1/-1;position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:10px;height:54px;padding:0 18px;background:var(--acc);color:#000;padding-top:env(safe-area-inset-top)}
.top .grow{flex:1;align-self:stretch}
.wc{display:flex;align-self:stretch;margin-right:-18px}.wc[hidden]{display:none}
.wc button{width:48px;border:0;background:transparent;color:#000;display:grid;place-items:center;cursor:default;padding:0}
.wc button svg{width:10px;height:10px;stroke-width:1}.wc button:hover{background:rgba(0,0,0,.14)}.wc button.x:hover{background:#E81123;color:#fff}
body.native .top{user-select:none;-webkit-user-select:none;background:var(--bg);color:#fff;height:36px;padding:0 18px}
body.native .top>svg,body.native .top>b{display:none}
body.native .wc button{color:#fff;height:36px}body.native .wc button:hover{background:rgba(255,255,255,.12)}body.native .wc button.x:hover{background:#E81123}
body.native .side{top:36px;height:calc(100dvh - 36px)}
html.native-win,html.native-win body{background:var(--bg)}
.rz{position:fixed;z-index:50;display:none}body.native .rz{display:block}
.rz[data-e=n]{top:0;left:8px;right:8px;height:5px;cursor:ns-resize}.rz[data-e=s]{bottom:0;left:8px;right:8px;height:5px;cursor:ns-resize}
.rz[data-e=e]{right:0;top:8px;bottom:8px;width:5px;cursor:ew-resize}.rz[data-e=w]{left:0;top:8px;bottom:8px;width:5px;cursor:ew-resize}
.rz[data-e=ne]{top:0;right:0;width:8px;height:8px;cursor:nesw-resize}.rz[data-e=sw]{bottom:0;left:0;width:8px;height:8px;cursor:nesw-resize}
.rz[data-e=nw]{top:0;left:0;width:8px;height:8px;cursor:nwse-resize}.rz[data-e=se]{bottom:0;right:0;width:8px;height:8px;cursor:nwse-resize}
body.native::after{content:"";position:fixed;inset:0;border:1px solid var(--line);border-radius:8px;pointer-events:none;z-index:60}
.top svg{width:26px;height:26px;flex:none}.top b{font-size:20px;font-weight:800;letter-spacing:-.04em}
.side{position:sticky;top:54px;height:calc(100dvh - 54px);overflow:hidden;display:flex;flex-direction:column;background:var(--panel);border-right:1px solid var(--line);padding:22px 10px;z-index:3}

.tr{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:10px;color:var(--ink);text-decoration:none;font-size:14.5px;min-width:0}
.tr span.t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tr:hover{background:var(--bg)}
.tr.on{background:var(--acc-soft);color:var(--acc);font-weight:650}
.tr .car{border:0;background:none;padding:0;width:18px;height:18px;display:grid;place-items:center;color:var(--quiet);cursor:pointer;border-radius:5px;flex:none;transition:transform .12s}
.tr .car.open{transform:rotate(90deg)}.tr .car.none{visibility:hidden}
.tr.hot{background:var(--sig);color:var(--sig-ink);outline:2px solid var(--sig-ink)}
.main{position:relative;z-index:2;padding:30px clamp(16px,3vw,44px) 130px;min-width:0}
.head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:18px 28px;margin-bottom:26px}
h1{margin:0;display:flex;flex-wrap:wrap;align-items:baseline;gap:0 .12em;min-width:0;font-size:clamp(32px,4.4vw,52px);line-height:1.05;letter-spacing:-.04em;font-weight:780}
h1 i{font-style:normal;color:var(--line);font-weight:400}
.crumb{color:var(--ink);text-decoration:none;border-radius:10px;padding:0 .06em;overflow-wrap:anywhere}
.crumb:not(:last-of-type){color:var(--quiet)}.crumb:hover{color:var(--acc)}
.crumb.hot{background:var(--sig);color:var(--sig-ink);outline:2px solid var(--sig-ink)}
.tools{display:flex;flex-wrap:wrap;gap:8px}
.btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:9px 14px;border-radius:10px;font-weight:600;font-size:14px;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--quiet)}
.btn.pri{background:var(--acc);border-color:var(--acc);color:var(--acc-ink)}.btn.pri:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent;border-color:transparent}
.btn.danger{background:var(--danger);border-color:var(--danger);color:#fff}
.btn:focus-visible,.tile:focus-visible,.tr:focus-visible,.crumb:focus-visible,.sb:focus-visible,.car:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.sec+.sec{margin-top:26px}
.dirs{display:grid;grid-template-columns:repeat(auto-fill,minmax(212px,1fr));gap:20px 14px;padding-top:6px}
.files{display:grid;grid-template-columns:repeat(auto-fill,minmax(176px,1fr));gap:14px}
.tile{position:relative;border-radius:14px;cursor:pointer;user-select:none;-webkit-user-select:none;min-width:0}
.tile.dir{display:flex;align-items:center;gap:12px;padding:15px 16px;background:var(--acc-soft)}
.tile.dir::before{content:"";position:absolute;top:-6px;left:14px;width:40px;height:10px;background:var(--acc-soft);border-radius:9px 9px 0 0}

.tile.dir .meta{min-width:0;padding-right:26px}
.tile.file{background:var(--panel);border:1px solid var(--line);overflow:hidden}
.thumb{aspect-ratio:4/3;display:grid;place-items:center;background:hsl(var(--h,230) 32% 94%);overflow:hidden}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.badge{font-weight:800;font-size:19px;letter-spacing:-.02em;color:hsl(var(--h,230) 45% 36%)}
.thumb{background:hsl(var(--h,230) 22% 20%)}.badge{color:hsl(var(--h,230) 70% 78%)}
.meta{padding:10px 12px 12px}
.name{display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden;overflow-wrap:anywhere;font-weight:600;font-size:14px;line-height:1.3}
.sub{display:block;color:var(--quiet);font-size:12.5px;margin-top:2px}
.tile.dir .meta{padding:0}
.tile.dir .name{font-size:15px}
.chk{position:absolute;top:9px;left:9px;width:24px;height:24px;border-radius:50%;border:2px solid #fff;background:rgba(21,25,43,.38);display:grid;place-items:center;color:transparent;opacity:0;transition:opacity .12s;cursor:pointer}
.tile:hover .chk,.tile.sel .chk,.selmode .chk{opacity:1}
.tile.sel .chk{background:var(--acc);border-color:var(--acc);color:var(--acc-ink)}
.tile.dir .chk{top:50%;left:auto;right:12px;margin-top:-12px;border-color:var(--acc)}
.tile.dir.sel .chk{border-color:var(--acc)}
@media(hover:none){.chk{opacity:1}}
.tile.sel{outline:2.5px solid var(--acc);outline-offset:-1px}
.tile.hot,.tile.dir.hot{background:var(--sig);color:var(--sig-ink);outline:2.5px solid var(--sig-ink)}
.tile.dir.hot::before{background:var(--sig)}
.tile.dir.hot .g,.tile.dir.hot .sub{color:var(--sig-ink)}
.list .dirs,.list .files{grid-template-columns:1fr;gap:8px}
.list .tile.file{display:flex;align-items:center}
.list .thumb{width:62px;aspect-ratio:1;flex:none}
.list .name{-webkit-line-clamp:1}
.list .meta{flex:1;min-width:0}
.empty{border:2px dashed var(--line);border-radius:20px;padding:56px 24px;text-align:center;color:var(--quiet);max-width:640px}
.empty b{display:block;font-size:22px;letter-spacing:-.02em;color:var(--ink);margin-bottom:6px}
.empty p{margin:0}
.veil{position:fixed;inset:0;z-index:1;background:var(--sig);color:var(--sig-ink);opacity:0;pointer-events:none;transition:opacity .16s;display:flex;align-items:flex-end;padding-bottom:3vh}
.veil.on{opacity:1}
.veil-in{display:flex;flex-direction:column;margin-left:calc(248px + clamp(16px,3vw,44px));min-width:0;max-width:calc(100vw - 300px)}
.veil-in span{font-size:clamp(18px,2.4vw,28px);font-weight:650}
.veil-in b{font-size:clamp(48px,11vw,152px);line-height:.95;letter-spacing:-.055em;font-weight:820;overflow-wrap:anywhere}
.selbar{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:20;display:flex;align-items:center;gap:2px;flex-wrap:wrap;justify-content:center;max-width:calc(100vw - 24px);background:var(--ink);color:var(--bg);padding:7px 8px 7px 18px;border-radius:26px;box-shadow:0 14px 44px rgba(10,12,30,.38);animation:rise .18s ease-out}
.selbar[hidden]{display:none}
.selbar b{margin-right:8px;font-weight:650;white-space:nowrap}
.sb{display:inline-flex;gap:6px;align-items:center;background:transparent;color:inherit;border:0;padding:9px 12px;border-radius:999px;font-weight:600;font-size:14px;cursor:pointer}
.sb:hover{background:color-mix(in srgb,currentColor 16%,transparent)}.sb.del{color:var(--del)}
@keyframes rise{from{transform:translate(-50%,14px);opacity:0}}
.tray{position:fixed;right:20px;bottom:20px;width:300px;z-index:19;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px 16px;box-shadow:0 14px 40px rgba(10,12,30,.22)}
.tray[hidden]{display:none}
.t-top{display:flex;justify-content:space-between;gap:10px;font-size:14px}.t-top span{color:var(--quiet);font-size:13px}
.bar{height:6px;border-radius:3px;background:var(--line);overflow:hidden;margin:10px 0 8px}.bar i{display:block;height:100%;background:var(--acc);transition:width .15s}
.t-it{font-size:12.5px;color:var(--quiet);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.toasts{position:fixed;top:14px;left:50%;transform:translateX(-50%);z-index:40;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;width:max-content;max-width:calc(100vw - 24px)}
.toast{background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;font-weight:550;box-shadow:0 8px 28px rgba(10,12,30,.3)}
.toast.bad{background:var(--danger);color:#fff}
#off{position:fixed;top:0;left:0;right:0;z-index:50;background:var(--danger);color:#fff;text-align:center;padding:7px;font-size:13.5px;font-weight:600}
#off[hidden]{display:none}
dialog{border:0;border-radius:20px;padding:0;background:var(--panel);color:var(--ink);width:min(440px,92vw);box-shadow:0 30px 80px rgba(8,10,28,.45)}
dialog::backdrop{background:rgba(12,14,30,.5);backdrop-filter:blur(3px)}
.dlg{padding:24px;display:flex;flex-direction:column;gap:14px;margin:0}
.dlg h2{margin:0;font-size:21px;letter-spacing:-.025em}.dlg p{margin:0;color:var(--quiet)}
.dlg input,.dlg textarea{width:100%;padding:11px 13px;border-radius:10px;border:1px solid var(--line);background:var(--bg)}
.dlg textarea{min-height:140px;resize:vertical}
.dlg input:focus,.dlg textarea:focus{outline:2px solid var(--acc);outline-offset:0;border-color:transparent}
.dlg .row{display:flex;justify-content:flex-end;gap:8px}
.dlg .row.sp{justify-content:space-between}
.plist{max-height:46vh;overflow:auto;display:flex;flex-direction:column;gap:2px;margin:0 -8px}
.pi{display:flex;align-items:center;gap:8px;border:0;background:none;text-align:left;padding:9px 10px;border-radius:10px;cursor:pointer}
.pi:hover:not(:disabled){background:var(--acc-soft)}.pi:disabled{opacity:.4;cursor:not-allowed}
#view{width:100vw;max-width:none;height:100dvh;max-height:none;margin:0;border-radius:0;background:rgba(9,11,24,.95);color:#fff}
#view::backdrop{background:none;backdrop-filter:none}
.pv{display:grid;grid-template-rows:auto minmax(0,1fr);height:100dvh}
.pv-top{display:flex;align-items:center;gap:10px;padding:14px 18px}
.pv-top b{flex:1;min-width:0;font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pv-top span.n{color:#9aa1bd;font-size:13px}
.pv .btn{background:rgba(255,255,255,.1);border-color:transparent;color:#fff}
.pv-stage{display:grid;place-items:center;padding:0 64px 18px;min-height:0;min-width:0}
.pv-stage>img,.pv-stage>video{max-width:100%;max-height:100%;border-radius:10px;display:block}
.pv-stage>iframe{width:100%;height:100%;border:0;border-radius:10px;background:#fff}
.pv-stage>audio{width:min(560px,100%)}
.pv-none{text-align:center;color:#aab0cb}
.pv-nav{position:absolute;top:50%;margin-top:-26px;width:48px;height:52px;border:0;border-radius:14px;background:rgba(255,255,255,.1);color:#fff;cursor:pointer;display:grid;place-items:center}
.pv-nav:hover{background:rgba(255,255,255,.2)}.pv-nav.l{left:8px}.pv-nav.r{right:8px}
#tree{flex:1;min-height:0;overflow:auto}
.devs{border-top:1px solid var(--line);padding:12px 2px 0;margin-top:10px}
.devs h3{margin:0 8px 6px;font-size:15px;font-weight:700;letter-spacing:-.02em;display:flex;justify-content:space-between;align-items:center}
.dev{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:12px;cursor:pointer;border:1px solid transparent;min-width:0}
.dev:hover{background:var(--bg)}
.dev .dm{min-width:0;display:flex;flex-direction:column}
.dev .dm b{font-size:14px;font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dev .dm span{font-size:12.5px;color:var(--quiet)}
.dev.ok>.ic{color:var(--acc)}
.dev.hot{background:var(--sig);color:var(--sig-ink);border-color:var(--sig-ink)}.dev.hot .dm span,.dev.hot>.ic{color:var(--sig-ink)}
.devnone{padding:4px 10px 8px;font-size:13px;color:var(--quiet)}
.cnt{background:var(--acc);color:var(--acc-ink);border-radius:999px;padding:0 7px;font-size:12px;line-height:18px;font-weight:700}

.addr{margin:0;font-size:13px;color:var(--quiet)}
.codein{font-size:30px;letter-spacing:.18em;text-align:center;font-weight:700}
.dlg label{font-weight:650;font-size:14px}

dialog{max-height:92dvh;overflow:auto}

}

.dev{position:relative}

.chkrow{display:flex;gap:10px;align-items:center;font-weight:500;font-size:14px;cursor:pointer}
.chkrow input{width:18px;height:18px;accent-color:var(--acc)}

/* ---------- drag and drop ---------- */
let dragDepth=0;
const types=e=>Array.from((e.dataTransfer&&e.dataTransfer.types)||[]);
const accepts=e=>{const t=types(e);return t.includes('Files')||t.includes('application/x-drop')};
function setVeil(p){$('#veilname').textContent=p?base(p):'Drop'}
function dropTarget(el,get,custom){
  el.addEventListener('dragover',e=>{if(!accepts(e))return;e.preventDefault();e.stopPropagation();const ext=types(e).includes('Files');e.dataTransfer.dropEffect=ext?'copy':'move';el.classList.add('hot');if(ext)setVeil(get())});
  el.addEventListener('dragleave',e=>{if(!el.contains(e.relatedTarget))el.classList.remove('hot')});
  el.addEventListener('drop',e=>{el.classList.remove('hot');if(!accepts(e))return;e.preventDefault();e.stopPropagation();custom?custom(e):handleDrop(e,get())});
}
window.addEventListener('dragenter',e=>{if(types(e).includes('Files')){dragDepth++;setVeil(R?R.peer&&R.peer.name:cwd);$('#veil').classList.add('on')}});
window.addEventListener('dragleave',e=>{if(types(e).includes('Files')){dragDepth=Math.max(0,dragDepth-1);if(!dragDepth)$('#veil').classList.remove('on')}});
window.addEventListener('dragover',e=>{e.preventDefault();if(types(e).includes('Files'))setVeil(R?R.peer&&R.peer.name:cwd)});
window.addEventListener('drop',()=>{dragDepth=0;$('#veil').classList.remove('on')},true);
window.addEventListener('dragend',()=>{dragDepth=0;$('#veil').classList.remove('on')});
window.addEventListener('drop',e=>{e.preventDefault();if(!accepts(e))return;if(R&&R.peer&&R.peer.state==='paired')deviceDrop(R.peer)(e);else if(!R)handleDrop(e,cwd)});
const rd=(en,m)=>new Promise((res,rej)=>en[m](res,rej));
async function walkEntry(en,prefix,out){
  if(en.isFile){out.push({file:await rd(en,'file'),rel:prefix+en.name})}
  else{
    const r=en.createReader();const all=[];
    for(;;){const b=await new Promise((res,rej)=>r.readEntries(res,rej));if(!b.length)break;all.push(...b)}
    if(!all.length)out.push({dir:prefix+en.name});
    for(const c of all)await walkEntry(c,prefix+en.name+'/',out);
  }
}
async function collect(e){
  const raw=e.dataTransfer.getData('application/x-drop');
  if(raw){try{return {internal:JSON.parse(raw)}}catch(er){return {out:[]}}}
  const ens=Array.from(e.dataTransfer.items||[]).filter(i=>i.kind==='file').map(i=>i.webkitGetAsEntry?i.webkitGetAsEntry():null);
  const plain=Array.from(e.dataTransfer.files||[]);
  const out=[];
  try{if(ens.length&&ens.every(Boolean))for(const en of ens)await walkEntry(en,'',out);else for(const f of plain)out.push({file:f,rel:f.name})}
  catch(er){out.length=0;for(const f of plain)out.push({file:f,rel:f.name})}
  return {out};
}
async function handleDrop(e,dest){
  const c=await collect(e);
  if(c.internal){await moveTo(c.internal,dest);return}
  for(const d of c.out.filter(x=>x.dir)){try{await api('/api/mkdir',{path:join(dest,d.dir)})}catch(er){}}
  enqueue(c.out.filter(x=>x.file),dest);
}
const deviceDrop=p=>async e=>{
  const c=await collect(e);
  if(c.internal){sendPaths(p,c.internal);return}
  enqueue(c.out.filter(x=>x.file),'',p);
};
$('#fpick').onchange=ev=>{enqueue(Array.from(ev.target.files).map(f=>({file:f,rel:f.name})),cwd);ev.target.value=''};

/* ---------- uploads ---------- */
const Q={wait:[],run:new Set(),b:{n:0,done:0,bytes:0,loaded:0,fail:0,label:'Uploading',to:''},hide:0};
function enqueue(list,dest,peer){
  if(!list.length)return;
  if(!Q.wait.length&&!Q.run.size)Q.b={n:0,done:0,bytes:0,loaded:0,fail:0,label:peer?'Sending':'Uploading',to:peer?peer.name:''};
  for(const it of list){Q.wait.push({file:it.file,path:join(dest,it.rel),loaded:0,peer:peer||null});Q.b.n++;Q.b.bytes+=it.file.size}
  pump();tray();
}
function pump(){while(Q.run.size<3&&Q.wait.length)send(Q.wait.shift())}
function send(it){
  Q.run.add(it);
  const x=new XMLHttpRequest();
  x.open('PUT',(it.peer?'/api/sendto/'+encodeURIComponent(it.peer.id)+'/':'/f/')+fp(it.path));
  x.upload.onprogress=e=>{Q.b.loaded+=e.loaded-it.loaded;it.loaded=e.loaded;tray()};
  const end=ok=>{
    Q.run.delete(it);Q.b.done++;Q.b.loaded+=it.file.size-it.loaded;it.loaded=it.file.size;
    if(!ok){Q.b.fail++;let m=it.peer&&!x.status?'can\u2019t reach '+it.peer.name:'transfer failed';try{m=JSON.parse(x.responseText).error||m}catch(e){}toast(it.file.name+': '+m,true)}
    pump();tray();if(!it.peer)refresh();
  };
  x.onload=()=>end(x.status<300);x.onerror=()=>end(false);
  x.send(it.file);
}
function tray(){
  const t=$('#tray'),b=Q.b;
  if(!b.n){t.hidden=true;return}
  t.hidden=false;
  const busy=Q.run.size+Q.wait.length,pct=b.bytes?Math.min(100,b.loaded/b.bytes*100):100;
  const ok=b.n-b.fail,files=ok===1?' file':' files';
  const head=busy?b.label+(b.to?' to '+b.to:'')+' '+Math.min(b.done+1,b.n)+' of '+b.n
    :(b.fail?ok+(b.to?' sent, ':' added, ')+b.fail+' failed':b.to?ok+files+' sent to '+b.to:ok+files+' added');
  put(t,
    h('div',{class:'t-top'},h('b',{},head),busy?h('span',{},fmt(b.loaded)+' / '+fmt(b.bytes)):null),
    h('div',{class:'bar'},h('i',{style:'width:'+pct+'%'})),
    Array.from(Q.run).slice(0,3).map(it=>h('div',{class:'t-it'},it.file.name)));
  if(!busy){clearTimeout(Q.hide);Q.hide=setTimeout(()=>{if(!Q.run.size&&!Q.wait.length){t.hidden=true;Q.b.n=0}},2800)}
}

let pv=null;
const fsrc=(p,dl)=>R?'/api/remote/f/'+fp(p)+'?id='+encodeURIComponent(R.id)+(dl?'&dl=1':''):'/f/'+fp(p)+(dl?'?dl=1':'');
function openPreview(p){
